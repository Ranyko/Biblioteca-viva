server {
    listen 80;
    listen [::]:80;
    server_name biblioteca-viva.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name biblioteca-viva.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/biblioteca-viva.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblioteca-viva.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/biblioteca-viva;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  postgres:
    image: postgres:15-alpine
    container_name: biblioteca-viva-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-biblioteca_viva}
    ports:
      - "5432:5432"
    volumes:
      - biblioteca-viva-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  biblioteca-viva-data:

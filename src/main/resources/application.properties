spring.application.name=biblioteca-viva
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_viva}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

api.security.token.secret=${JWT_SECRET:chave-local-biblioteca-viva-troque-em-producao-2026}
api.security.token.issuer=biblioteca-viva-api
api.security.token.expiration-hours=2

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never
